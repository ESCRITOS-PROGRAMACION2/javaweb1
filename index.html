<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Quiz_JSP.java — Escrito</title>
<style>
:root{
  color-scheme: dark;
  --bg: #16171f; --panel: #1d1f2b; --panel-2: #23253383; --border: #2d2f42;
  --text: #d7d9e8; --muted: #6f7390; --amber: #ffb454; --amber-dim: #ffb45433;
  --green: #7ee787; --green-dim: #7ee78722; --red: #ff7b72; --red-dim: #ff7b7222;
  --mono: ui-monospace, "Cascadia Code", "SF Mono", Consolas, "Fira Code", monospace;
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

body {
  background: var(--bg);
  color: var(--text);
  font-family: var(--mono);
  font-size: 14px;
  line-height: 1.6;
  min-height: 100vh;
  padding: 24px 16px 48px;
}

/* ── ventana ── */
.window {
  max-width: 780px;
  margin: 0 auto;
  background: var(--panel);
  border: 1px solid var(--border);
  border-radius: 10px;
  overflow: hidden;
}

.titlebar {
  display: flex;
  align-items: center;
  gap: 8px;
  background: #13141c;
  border-bottom: 1px solid var(--border);
  padding: 10px 16px;
  user-select: none;
}
.dot { width: 12px; height: 12px; border-radius: 50%; }
.dot.red    { background: #ff5f57; }
.dot.yellow { background: #febc2e; }
.dot.green  { background: #28c840; }
.tab-title  { margin-left: 10px; font-size: 13px; color: var(--muted); flex: 1; }
.build-status           { font-size: 12px; color: var(--muted); }
.build-status.ok        { color: var(--green); }

.content { padding: 24px 28px 32px; }

/* ── splash ── */
.splash {
  display: flex;
  flex-direction: column;
  align-items: center;
  text-align: center;
  padding: 40px 20px 44px;
  gap: 20px;
}
.splash h1 {
  font-size: 20px;
  font-weight: 700;
  color: var(--amber);
  letter-spacing: .02em;
}
.splash p {
  color: var(--muted);
  font-size: 13.5px;
  max-width: 480px;
  line-height: 1.65;
}
.splash input[type="text"] {
  width: 100%;
  max-width: 380px;
  background: #12131c;
  border: 1px solid var(--border);
  border-radius: 6px;
  color: var(--text);
  font-family: var(--mono);
  font-size: 14px;
  padding: 10px 14px;
  outline: none;
  transition: border-color .15s;
  text-align: center;
}
.splash input[type="text"]:focus { border-color: var(--amber); }
.btn-begin {
  background: var(--amber);
  color: #16171f;
  border: none;
  border-radius: 6px;
  font-family: var(--mono);
  font-size: 15px;
  font-weight: 700;
  padding: 11px 36px;
  cursor: pointer;
  transition: opacity .15s;
}
.btn-begin:hover    { opacity: .88; }
.btn-begin:disabled { opacity: .4; cursor: default; }
.splash-err {
  font-size: 12px;
  color: var(--red);
  min-height: 16px;
}

/* ── quiz header ── */
.quiz-header { margin-bottom: 24px; }
.quiz-header h1 { font-size: 17px; font-weight: 600; color: var(--amber); margin-bottom: 2px; }
.quiz-header p  { color: var(--muted); font-size: 12.5px; }

/* ── pregunta ── */
.question {
  background: var(--panel-2);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 18px 20px 20px;
  margin-bottom: 18px;
}
.q-num {
  font-size: 11px; color: var(--muted); margin-bottom: 4px;
  text-transform: uppercase; letter-spacing: .06em;
}
.qtype {
  display: inline-block; font-size: 11px;
  background: var(--amber-dim); color: var(--amber); border: 1px solid var(--amber);
  border-radius: 4px; padding: 1px 7px; margin-bottom: 10px;
  text-transform: uppercase; letter-spacing: .05em;
}
.qtype-open { background: var(--green-dim); color: var(--green); border-color: var(--green); }
.q-text { font-size: 14px; margin-bottom: 12px; color: var(--text); line-height: 1.55; }

/* ── bloque de código ── */
.code-block {
  display: block;
  font-family: var(--mono);
  background: #12131c;
  border: 1px solid var(--border);
  border-radius: 6px;
  padding: 12px 14px;
  margin: 10px 0 14px;
  font-size: 13px;
  overflow-x: auto;
  white-space: pre-wrap;   /* preserva espacios/indentación, permite scroll */
  color: #c9cbe0;
  line-height: 2;          /* espacio generoso para que los inputs no se superpongan */
}
.code-block .kw   { color: #c792ea; }
.code-block .type { color: #82aaff; }
.code-block .fn   { color: #82aaff; }
.code-block .str  { color: #c3e88d; }

/* inputs dentro del bloque de código (preguntas de completar) */
.code-block input[type="text"] {
  display: inline-block;
  vertical-align: middle;
  background: var(--panel);
  border: 1px solid var(--amber);
  border-radius: 4px;
  color: var(--amber);
  font-family: var(--mono);
  font-size: 12.5px;
  padding: 0 8px;
  height: 24px;
  width: 130px;
  outline: none;
  white-space: normal;
}
.code-block input[type="text"]:focus { background: var(--amber-dim); }

/* ── respuesta abierta ── */
.open-answer {
  width: 100%;
  background: var(--panel-2);
  border: 1px solid var(--border);
  border-radius: 6px;
  color: var(--text);
  font-family: var(--mono);
  font-size: 13px;
  padding: 10px 12px;
  resize: vertical;
  min-height: 90px;
  outline: none;
  transition: border-color .15s;
}
.open-answer:focus { border-color: var(--amber); }

/* ── opciones ── */
.options { display: flex; flex-direction: column; gap: 8px; }
.option {
  display: flex; align-items: flex-start; gap: 10px;
  background: var(--panel); border: 1px solid var(--border); border-radius: 6px;
  padding: 10px 14px; cursor: pointer;
  transition: border-color .12s, background .12s;
  user-select: none;
}
.option:hover    { border-color: var(--amber); }
.option.selected { border-color: var(--amber); background: var(--amber-dim); }
.option.locked   { pointer-events: none; opacity: .75; }
.option input[type="radio"] { display: none; }
.option-label { font-size: 13.5px; color: var(--text); line-height: 1.5; }
.tf-row { display: flex; gap: 10px; }

/* ── footer / enviar ── */
.quiz-footer {
  margin-top: 28px;
  display: flex;
  flex-direction: column;
  align-items: flex-end;
  gap: 10px;
}
.status-msg            { font-size: 12px; color: var(--muted); align-self: flex-start; }
.status-msg.warn       { color: var(--amber); }
.status-msg.error      { color: var(--red); }
.status-msg.ok         { color: var(--green); }
.btn-submit {
  background: var(--amber); color: #16171f; border: none; border-radius: 6px;
  font-family: var(--mono); font-size: 14px; font-weight: 600;
  padding: 10px 26px; cursor: pointer; transition: opacity .15s;
}
.btn-submit:hover    { opacity: .88; }
.btn-submit:disabled { opacity: .4; cursor: default; }

/* ── pantalla de gracias ── */
.thanks { text-align: center; padding: 48px 24px; }
.thanks h2 { color: var(--green); font-size: 22px; margin-bottom: 8px; }
.thanks p  { color: var(--muted); font-size: 14px; }

@media (max-width: 520px) {
  body { padding: 0; }
  .window { border-radius: 0; }
  .titlebar { border-radius: 0; padding: 10px 12px; }
}
</style>
</head>
<body>

<div class="window">
  <div class="titlebar">
    <span class="dot red"></span>
    <span class="dot yellow"></span>
    <span class="dot green"></span>
    <span class="tab-title">Quiz_JSP.java</span>
    <span class="build-status" id="build-status">● en progreso</span>
  </div>
  <div class="content" id="main-content"><!-- JS --></div>
</div>

<script>
// ⚠ REEMPLAZÁ esta URL por la tuya: Implementar → Administrar implementaciones → URL de App web
const SHEET_WEBAPP_URL = "https://script.google.com/macros/s/AKfycbyvMoAslMId9-Zaa-UVHue-ALHLyY8YLhP2-r6GivSZsZuwq4SfihWdz389bh3RGmxr/exec";
                          
const LS_KEY = "servletsJspSubmitted";

/* ─── PREGUNTAS ─────────────────────────────────────────────────────────── */
const questions = [
  {
    id: "q1", type: "open",
    text: "Escribe con tus palabras: ¿Qué es un Servlet?"
  },
  {
    id: "q2", type: "single",
    text: "¿Cuál es la función principal del archivo pom.xml en Apache Maven?",
    options: [
      { id: "a", label: "Funcionar como un servidor web para ejecutar Servlets y procesar peticiones HTTP." },
      { id: "b", label: "Centralizar la configuración del proyecto, especificando sus dependencias, plugins y el ciclo de vida de construcción." },
      { id: "c", label: "Traducir automáticamente las clases de Java a código ejecutable en el navegador web." },
      { id: "d", label: "Administrar la base de datos de la aplicación y ejecutar las consultas SQL." }
    ]
  },
  {
    id: "q3", type: "blank",
    text: "Completar el siguiente formulario HTML para el cálculo de sueldo de empleados.",
    code: `&lt;form action="__BLANK0__" method="__BLANK1__"&gt;\n    &lt;!-- Título del formulario --&gt;\n    &lt;h2&gt;Calculo de Sueldo Empleados&lt;/h2&gt;\n    &lt;br&gt;\n    &lt;label&gt;Nombre:\n        &lt;input type="__BLANK2__" name="__BLANK3__" /&gt;\n    &lt;/label&gt;\n    &lt;br&gt;\n    &lt;label&gt;Sueldo por Día:\n        &lt;input type="__BLANK4__" name="__BLANK5__" /&gt;\n    &lt;/label&gt;\n    &lt;br&gt;\n    &lt;label&gt;Días Trabajados:\n        &lt;input type="__BLANK6__" name="__BLANK7__" /&gt;\n    &lt;/label&gt;\n    &lt;br&gt;\n    &lt;button type="__BLANK8__"&gt;Calculo de Sueldo&lt;/button&gt;\n&lt;/form&gt;`,
    blanks: 9
  },
  {
    id: "q4", type: "tf",
    text: "Indicar si el siguiente código, al cumplirse la condición (por ejemplo con ?ok=1 en la URL), muestra en pantalla el mensaje de confirmación. Verdadero o falso.",
    code: `&lt;c:if test=&quot;\${param.ok == '1'}&quot;&gt;\n    &lt;p class=&quot;ok&quot;&gt;Producto agregado correctamente.&lt;/p&gt;\n&lt;/c:if&gt;`
  },
  {
    id: "q5", type: "blank",
    text: 'Completar el método doPost para capturar el dato "nombre" enviado desde el cliente.',
    code: `<span class="kw">@Override</span>\n<span class="kw">protected</span> <span class="type">void</span> <span class="fn">doPost</span>(HttpServletRequest request, HttpServletResponse response)\n        <span class="kw">throws</span> ServletException, IOException {\n    String nombre = request.__BLANK0__(<span class="str">"nombre"</span>);`,
    blanks: 1
  },
  {
    id: "q6", type: "blank",
    text: 'Completar para guardar el dato capturado en el request, de forma que pueda ser enviado a la Vista (JSP).',
    code: `request.__BLANK0__(&quot;__BLANK1__&quot;, __BLANK2__);`,
    blanks: 3
  },
  {
    id: "q7", type: "blank",
    text: 'Completar el procedimiento para enviar el "paquete" con los datos a la página JSP (Vista).',
    code: `request.__BLANK0__(&quot;resultado.jsp&quot;).__BLANK1__(request, response);`,
    blanks: 2
  },
  {
    id: "q8", type: "tf",
    text: "Indicar si el siguiente código genera una nueva sesión HTTP. Verdadero o falso.",
    code: `HttpSession sesion = request.setSession();`
  },
  {
    id: "q9", type: "open",
    text: "Explicar qué hace el siguiente código.",
    code: `<span class="kw">if</span> (carrito == <span class="kw">null</span>) {\n    carrito = <span class="kw">new</span> ArrayList&lt;&gt;();\n    sesion.setAttribute(<span class="str">"carrito"</span>, carrito);\n}`
  },
  {
    id: "q10", type: "single",
    text: "Completar (elegir la opción correcta):",
    code: `String user = request._________(&quot;usuario&quot;);`,
    options: [
      { id: "a", label: "getValue" },
      { id: "b", label: "getAttribute" },
      { id: "c", label: "setSession" },
      { id: "d", label: "getParameter" }
    ]
  },
  {
    id: "q11", type: "tf",
    text: "¿Cuando hacemos clic en un enlace o hipervínculo, estamos utilizando de forma implícita un método GET? Verdadero o falso."
  }
];

/* ─── ESTADO ─────────────────────────────────────────────────────────────── */
const state   = {};
let locked    = false;
let quizFinished  = false;
let quizStarted   = false;   // true después de pasar la pantalla de inicio
let alreadySubmitted = false;
let studentName = "";

const typeLabels = {
  single: "opción única", tf: "verdadero / falso",
  blank: "completar",     open: "pregunta abierta"
};

/* ─── SHUFFLE ────────────────────────────────────────────────────────────── */
function shuffle(arr) {
  for (let i = arr.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
}
shuffle(questions);

/* ─── PANTALLA DE INICIO ─────────────────────────────────────────────────── */
function renderSplash() {
  document.getElementById("main-content").innerHTML = `
    <div class="splash">
      <h1>Quiz_JSP.java</h1>
      <p>Escribir nombre y apellido para comenzar. El cuestionario se abre en
         pantalla completa; si se sale de pantalla completa antes de terminar,
         se envía automáticamente con lo que esté respondido hasta ese momento.</p>
      <input type="text" id="splash-name" placeholder="Nombre y apellido"
             autocomplete="off" spellcheck="false" />
      <div class="splash-err" id="splash-err"></div>
      <button class="btn-begin" id="btn-begin" onclick="beginQuiz()">Comenzar</button>
    </div>`;

  // Enter también inicia
  document.getElementById("splash-name").addEventListener("keydown", e => {
    if (e.key === "Enter") beginQuiz();
  });
}

function beginQuiz() {
  const nameEl = document.getElementById("splash-name");
  const name   = nameEl ? nameEl.value.trim() : "";
  if (!name) {
    document.getElementById("splash-err").textContent = "⚠ Ingresá tu nombre antes de comenzar.";
    nameEl.focus();
    return;
  }
  studentName  = name;
  quizStarted  = true;
  requestFS();
  renderQuiz();
}

/* ─── QUIZ ───────────────────────────────────────────────────────────────── */
function renderQuiz() {
  let html = `
    <div class="quiz-header">
      <h1>// Servlets &amp; JSP — Escrito</h1>
      <p>Respondé lo que sabés y enviá cuando estés listo/a. Las preguntas sin
         responder quedan en blanco.</p>
    </div>`;

  questions.forEach((q, i) => {
    const isOpen     = q.type === "open";
    const qtypeClass = isOpen ? "qtype qtype-open" : "qtype";
    html += `<div class="question" id="wrap-${q.id}">
      <div class="q-num">Pregunta ${i + 1} de ${questions.length}</div>
      <div class="${qtypeClass}">${typeLabels[q.type]}</div>
      <div class="q-text">${q.text}</div>`;

    // bloque de código con white-space:pre-wrap — sin divs intermedios
    if (q.code) {
      let codeHtml = q.code;
      if (q.type === "blank") {
        for (let b = 0; b < q.blanks; b++) {
          codeHtml = codeHtml.replace(
            `__BLANK${b}__`,
            `<input type="text" data-qid="${q.id}" data-blank="${b}" placeholder="?" autocomplete="off" spellcheck="false" />`
          );
        }
      }
      html += `<code class="code-block">${codeHtml}</code>`;
    }

    if (q.type === "open") {
      html += `<textarea class="open-answer" data-qid="${q.id}"
                 placeholder="Escribí tu respuesta acá..." rows="4"></textarea>`;
    } else if (q.type === "single") {
      html += `<div class="options">`;
      q.options.forEach(opt => {
        html += `<label class="option" data-qid="${q.id}" data-val="${opt.id}">
          <input type="radio" name="${q.id}" value="${opt.id}" />
          <span class="option-label"><strong>${opt.id})</strong> ${opt.label}</span>
        </label>`;
      });
      html += `</div>`;
    } else if (q.type === "tf") {
      html += `<div class="tf-row">
        <label class="option" data-qid="${q.id}" data-val="true">
          <input type="radio" name="${q.id}" value="true" />
          <span class="option-label">✓ Verdadero</span>
        </label>
        <label class="option" data-qid="${q.id}" data-val="false">
          <input type="radio" name="${q.id}" value="false" />
          <span class="option-label">✗ Falso</span>
        </label>
      </div>`;
    }
    html += `</div>`;
  });

  html += `<div class="quiz-footer">
    <div class="status-msg" id="status-msg"></div>
    <button class="btn-submit" id="btn-submit" onclick="handleSubmit()">Enviar respuestas →</button>
  </div>`;

  document.getElementById("main-content").innerHTML = html;
  attachListeners();
}

function attachListeners() {
  document.querySelectorAll(".open-answer").forEach(ta => {
    ta.addEventListener("input", () => { state[ta.dataset.qid] = ta.value; });
  });
  document.querySelectorAll(".option").forEach(lbl => {
    lbl.addEventListener("click", () => {
      if (locked) return;
      state[lbl.dataset.qid] = lbl.dataset.val;
      document.querySelectorAll(`.option[data-qid="${lbl.dataset.qid}"]`).forEach(l =>
        l.classList.toggle("selected", l.dataset.val === lbl.dataset.val)
      );
    });
  });
  document.querySelectorAll("[data-blank]").forEach(inp => {
    inp.addEventListener("input", () => {
      state[`${inp.dataset.qid}_${inp.dataset.blank}`] = inp.value;
    });
  });
}

/* ─── SUBMIT ─────────────────────────────────────────────────────────────── */
function buildPayload() {
  const answers = {};
  questions.forEach(q => {
    if (q.type === "blank") {
      const parts = [];
      for (let b = 0; b < q.blanks; b++) parts.push(state[`${q.id}_${b}`] || "");
      answers[q.id] = parts.join(" | ");
    } else {
      answers[q.id] = state[q.id] || "";
    }
  });
  return { nombre: studentName, ...answers, timestamp: new Date().toISOString() };
}

function lockAll() {
  locked = true;
  document.querySelectorAll("textarea, input").forEach(el => el.disabled = true);
  document.querySelectorAll(".option").forEach(el => el.classList.add("locked"));
}

function renderThanks() {
  document.getElementById("main-content").innerHTML = `
    <div class="thanks">
      <h2>✓ Escrito enviado</h2>
      <p>Tus respuestas fueron registradas correctamente.<br>Podés cerrar esta ventana.</p>
    </div>`;
  const bs = document.getElementById("build-status");
  bs.textContent = "● enviado";
  bs.className   = "build-status ok";
  quizFinished   = true;
}

function performSubmit(payload) {
  quizFinished = true;   // evitar doble disparo de fullscreen
  lockAll();

  const btn = document.getElementById("btn-submit");
  if (btn) { btn.disabled = true; btn.textContent = "Enviando…"; }
  const msg = document.getElementById("status-msg");
  if (msg) { msg.textContent = "Enviando respuestas…"; msg.className = "status-msg"; }

  // mode:"no-cors" es necesario cuando el archivo se abre localmente (file://)
  // La respuesta será opaca pero el request SÍ llega al servidor de Google
  fetch(SHEET_WEBAPP_URL, {
    method: "POST",
    mode: "no-cors",
    headers: { "Content-Type": "text/plain" },
    body: JSON.stringify(payload)
  })
  .then(() => {
    // Con no-cors el .then() se ejecuta cuando el request fue enviado
    try { localStorage.setItem(LS_KEY, "1"); } catch(e) {}
    renderThanks();
  })
  .catch(err => {
    // Solo llega aquí si hay error de red real (sin conexión, URL mal formada)
    quizFinished = false;
    locked = false;
    document.querySelectorAll("textarea, input").forEach(el => el.disabled = false);
    document.querySelectorAll(".option").forEach(el => el.classList.remove("locked"));
    const btn2 = document.getElementById("btn-submit");
    if (btn2) { btn2.disabled = false; btn2.textContent = "Reintentar envío"; }
    const msg2 = document.getElementById("status-msg");
    if (msg2) {
      msg2.textContent = "⚠ No se pudo enviar. Verificá la URL del script y la conexión a internet.";
      msg2.className = "status-msg error";
    }
  });
}

function handleSubmit() {
  if (locked || quizFinished) return;
  // No hay validación de respuestas obligatorias — se envía lo que esté
  performSubmit(buildPayload());
}

/* ─── FULLSCREEN ─────────────────────────────────────────────────────────── */
function isFullscreen() {
  return !!(document.fullscreenElement
          || document.webkitFullscreenElement
          || document.mozFullScreenElement);
}

function requestFS() {
  const el = document.documentElement;
  const fn = el.requestFullscreen || el.webkitRequestFullscreen || el.mozRequestFullScreen;
  if (fn) fn.call(el).catch(() => {});
}

function onFsChange() {
  // Solo actuar si el quiz ya empezó y no terminó
  if (!quizStarted || quizFinished || alreadySubmitted) return;
  if (!isFullscreen()) {
    // El estudiante salió de pantalla completa → enviar inmediatamente
    performSubmit(buildPayload());
  }
}

document.addEventListener("fullscreenchange",       onFsChange);
document.addEventListener("webkitfullscreenchange", onFsChange);
document.addEventListener("mozfullscreenchange",    onFsChange);

/* ─── INIT ───────────────────────────────────────────────────────────────── */
try {
  if (localStorage.getItem(LS_KEY) === "1") {
    alreadySubmitted = true;
    renderThanks();
  } else {
    renderSplash();
  }
} catch(e) {
  renderSplash();
}
</script>
</body>
</html>
